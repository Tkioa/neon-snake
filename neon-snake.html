<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霓虹贪吃蛇</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2b;--green:#55f7a5;--cyan:#58d9ff;--muted:#9db0c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#152a40 0%,var(--bg) 60%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef7ff}
.wrap{width:min(100%,560px)}header{text-align:center;margin-bottom:18px}h1{margin:0;font-size:clamp(28px,7vw,42px);letter-spacing:2px}h1 span{color:var(--green)}.sub{color:var(--muted);margin-top:6px;font-size:14px}
.stats{display:flex;gap:12px;margin-bottom:12px}.stat{flex:1;background:var(--panel);border:1px solid #25364d;border-radius:14px;padding:12px 16px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:24px;color:var(--green)}
.gamebox{position:relative;border:1px solid #2c425a;border-radius:16px;overflow:hidden;box-shadow:0 20px 70px #0008;background:#08121d}canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#07101bd9;padding:24px}.overlay.hidden{display:none}.message h2{font-size:28px;margin:0 0 8px}.message p{color:var(--muted);margin:0 0 18px}
button{border:0;border-radius:11px;padding:12px 18px;font-weight:750;font-size:15px;cursor:pointer;background:var(--green);color:#052014}button.secondary{background:#1a2b40;color:#eaf5ff;border:1px solid #344c67}.controls{display:flex;gap:10px;margin-top:12px}.controls button{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,46px);gap:7px;justify-content:center;margin:16px auto 0}.pad button{padding:0;background:#15263a;color:#dff8ff;border:1px solid #35506c;font-size:20px;touch-action:manipulation}.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7}
@media(min-width:560px){.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,40px)}}
</style>
</head>
<body>
<main class="wrap">
<header><h1>NEON <span>SNAKE</span></h1><div class="sub">吃掉光点 · 不断成长 · 挑战最高分</div></header>
<section class="stats">
 <div class="stat"><small>本局得分</small><strong id="score">0</strong></div>
 <div class="stat"><small>最高纪录</small><strong id="best">0</strong></div>
</section>
<div class="gamebox">
 <canvas id="board" width="480" height="480" aria-label="贪吃蛇游戏区域"></canvas>
 <div class="overlay" id="overlay"><div class="message"><h2 id="headline">准备好了吗？</h2><p id="description">用方向键控制蛇移动</p><button id="start">开始游戏</button></div></div>
</div>
<div class="controls"><button id="pause" class="secondary">⏸ 暂停</button><button id="restart">↻ 重新开始</button></div>
<div class="pad" aria-label="触屏方向控制">
 <button class="up" data-dir="up" aria-label="向上">▲</button><button class="left" data-dir="left" aria-label="向左">◀</button><button class="down" data-dir="down" aria-label="向下">▼</button><button class="right" data-dir="right" aria-label="向右">▶</button>
</div>
<div class="hint">键盘：方向键 / WASD 移动 · 空格暂停<br>手机：点击方向按钮或在棋盘上滑动</div>
</main>
<script>
(() => {
 const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');
 const N=24,CELL=canvas.width/N;
 const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');
 const overlay=document.querySelector('#overlay'),headline=document.querySelector('#headline'),description=document.querySelector('#description'),startBtn=document.querySelector('#start'),pauseBtn=document.querySelector('#pause');
 let snake,food,dir,nextDir,score,best=0,timer=null,running=false,paused=false,over=false;
 try{best=Number(localStorage.getItem('neonSnakeBest')||0)}catch{} bestEl.textContent=best;
 const same=(a,b)=>a.x===b.x&&a.y===b.y;
 function randomFood(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>same(s,p)));return p}
 function reset(){clearInterval(timer);snake=[{x:7,y:12},{x:6,y:12},{x:5,y:12},{x:4,y:12}];dir={x:1,y:0};nextDir={...dir};score=0;scoreEl.textContent=score;food=randomFood();running=false;paused=false;over=false;draw();show('准备好了吗？','用方向键控制蛇移动','开始游戏')}
 function show(title,desc,button){headline.textContent=title;description.textContent=desc;startBtn.textContent=button;overlay.classList.remove('hidden')}
 function hide(){overlay.classList.add('hidden')}
 function begin(){if(over)reset();running=true;paused=false;over=false;hide();clearInterval(timer);timer=setInterval(tick,Math.max(65,135-score*1.2));draw()}
 function togglePause(){if(!running||over)return;paused=!paused;if(paused)show('已暂停','休息一下，准备继续','继续游戏');else hide();draw()}
 function tick(){if(!running||paused||over)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eating=same(head,food);const body=eating?snake:snake.slice(0,-1);
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(s=>same(s,head))){gameOver();return}
  snake.unshift(head);if(eating){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonSnakeBest',String(best))}catch{} }food=randomFood();clearInterval(timer);timer=setInterval(tick,Math.max(65,135-score*1.2))}else snake.pop();draw()}
 function gameOver(){running=false;over=true;clearInterval(timer);show('游戏结束','本局得分：'+score+' · 再来挑战一次吧','再玩一次');draw()}
 function setDirection(d){if(!running||paused||over)return;const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const v=map[d];if(v&&!(v.x===-dir.x&&v.y===-dir.y))nextDir=v}
 function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
 function draw(){ctx.fillStyle='#08121d';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#142538';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(480,i*CELL);ctx.stroke()}
  ctx.save();ctx.shadowColor='#ff6b8a';ctx.shadowBlur=18;ctx.fillStyle='#ff6b8a';ctx.beginPath();ctx.arc((food.x+.5)*CELL,(food.y+.5)*CELL,CELL*.29,0,Math.PI*2);ctx.fill();ctx.restore();
  snake.forEach((s,i)=>{ctx.save();ctx.shadowColor=i===0?'#55f7a5':'#28c98b';ctx.shadowBlur=i===0?16:5;ctx.fillStyle=i===0?'#a0ffd0':`hsl(${150-i*1.5} 82% ${Math.max(35,58-i*.45)}%)`;rounded(s.x*CELL+2,s.y*CELL+2,CELL-4,CELL-4,5);ctx.restore()});
  const h=snake[0];ctx.fillStyle='#073324';if(dir.x!==0){ctx.beginPath();ctx.arc((h.x+.5)*CELL,(h.y+.32)*CELL,2.2,0,Math.PI*2);ctx.arc((h.x+.5)*CELL,(h.y+.68)*CELL,2.2,0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.arc((h.x+.32)*CELL,(h.y+.5)*CELL,2.2,0,Math.PI*2);ctx.arc((h.x+.68)*CELL,(h.y+.5)*CELL,2.2,0,Math.PI*2);ctx.fill()}}
 startBtn.addEventListener('click',begin);document.querySelector('#restart').addEventListener('click',()=>{reset();begin()});pauseBtn.addEventListener('click',togglePause);
 document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.dir)));
 document.addEventListener('keydown',e=>{const keys={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(keys[e.key]){e.preventDefault();setDirection(keys[e.key])}if(e.code==='Space'){e.preventDefault();if(!running&&!over)begin();else togglePause()}});
 let touchStart=null;canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touchStart=null},{passive:true});
 reset();
})();
</script>
</body>
</html>
